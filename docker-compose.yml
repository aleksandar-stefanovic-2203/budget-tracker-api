services:
  api:
    build:
      context: .
    depends_on:
      initialize-database:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://database:1433;databaseName=budget_tracker;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose}
    ports:
      - "8080:8080"

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  initialize-database:
    image: mcr.microsoft.com/mssql-tools18:latest
    depends_on:
      - database
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        for attempt in {1..60}; do
          if /opt/mssql-tools18/bin/sqlcmd -S database -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID(N'budget_tracker') IS NULL CREATE DATABASE [budget_tracker]"; then
            exit 0
          fi
          sleep 2
        done
        exit 1

volumes:
  sqlserver-data:
